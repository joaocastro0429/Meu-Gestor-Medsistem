services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gestor_med
      POSTGRES_USER: gestor_med
      POSTGRES_PASSWORD: gestor_med
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gestor_med -d gestor_med"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
