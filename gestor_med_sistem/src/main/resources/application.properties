spring.application.name=gestor_med_sistem

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestor_med}
spring.datasource.username=${DB_USERNAME:gestor_med}
spring.datasource.password=${DB_PASSWORD:gestor_med}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

server.error.include-message=always
server.error.include-stacktrace=never
